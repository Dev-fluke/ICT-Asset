<script>
// ฟังก์ชันสแกนและเรนเดอร์ข้อมูลผู้ใช้ รองรับการทำงานร่วมกับ SPA Router
window.renderSidebarProfileData = function() {
    const nameEl = document.getElementById('sidebar-user-fullname') || document.getElementById('user-display-name') || document.getElementById('user-fullname');
    const roleBadgeEl = document.getElementById('sidebar-user-role') || document.getElementById('user-role-badge') || document.getElementById('user-role');
    const avatarEl = document.getElementById('sidebar-user-avatar') || document.getElementById('user-avatar');
    const usernameEl = document.getElementById('sidebar-user-username') || document.getElementById('user-username');

    const rawData = localStorage.getItem('user') || localStorage.getItem('user_session') || sessionStorage.getItem('user');
    let userData = null;

    try {
        if (rawData) userData = JSON.parse(rawData);
    } catch (e) {
        console.error('Parse User Error:', e);
    }

    if (!userData) {
        if (nameEl) nameEl.textContent = 'ยังไม่ได้เข้าสู่ระบบ';
        if (roleBadgeEl) roleBadgeEl.textContent = 'ไม่ระบุ';
        return;
    }

    const userName = userData.fullname || userData.name || userData.username || 'ผู้ใช้งานระบบ';
    const roleRaw = String(userData.role || 'staff').toLowerCase().trim();
    const isAdmin = roleRaw === 'admin';
    let roleText = 'เจ้าหน้าที่';
    let badgeClass = 'bg-primary text-white';

    if (isAdmin) {
        roleText = 'Admin';
        badgeClass = 'bg-danger text-white';
    } else if (roleRaw === 'technician') {
        roleText = 'ช่างเทคนิค';
        badgeClass = 'bg-warning text-dark';
    }

    const avatarUrl = userData.avatar_url || (userData.avatar ? `/uploads/${userData.avatar}` : null) || userData.profile_image;

    if (nameEl) nameEl.textContent = userName;
    if (usernameEl) usernameEl.textContent = `@${userData.username || 'user'}`;
    
    if (roleBadgeEl) {
        roleBadgeEl.textContent = roleText;
        roleBadgeEl.className = `badge rounded-pill px-2 py-0.5 small fw-semibold flex-shrink-0 ${badgeClass}`;
    }

    if (avatarEl) {
        if (avatarUrl && avatarUrl.trim() !== '' && avatarUrl !== '/public/images/default-avatar.png') {
            avatarEl.src = avatarUrl;
        } else {
            avatarEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=0d6efd&color=fff`;
        }
    }

    // แสดงเมนูตั้งค่า (users.html) เฉพาะผู้ใช้ที่มีสิทธิ์ Admin เท่านั้น
    const settingMenu = document.getElementById('sidebar-menu-setting');
    if (settingMenu) {
        settingMenu.style.display = isAdmin ? '' : 'none';
    }
};

// รันฟังก์ชันเมื่อโหลดคอมโพเนนต์ Sidebar นี้เข้ามา
window.renderSidebarProfileData();
setTimeout(window.renderSidebarProfileData, 50);
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>จัดการสังกัดและหน่วยงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; background: #f8fafc; } </style>
           <!-- 🔒 ดึงไฟล์ Auth Guard มาทำงานก่อนใครเพื่อน -->
    <script src="../auth-guard.js"></script>
     <!-- ออกจากระบบ -->
    <script src="../global-app.js"></script> 
</head>
<body class="p-4">
    <div class="container" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold"><i class="fa-solid fa-sitemap text-primary me-2"></i>จัดการสังกัด และ หน่วยงาน</h4>
            <a href="equipments.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> ย้อนกลับ</a>
        </div>

        <!-- การ์ดเพิ่มหน่วยงานใหม่ -->
        <div class="card border-0 shadow-sm p-4 mb-4">
            <h6 class="fw-bold mb-3"><i class="fa-solid fa-plus-circle me-1 text-success"></i> เพิ่มหน่วยงานใหม่ผูกกับสังกัด</h6>
            <form onsubmit="saveOrganization(event)">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label small fw-bold">เลือกสังกัด</label>
                        <select id="select-dept" class="form-select" required>
                            <option value="">-- เลือกสังกัด --</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label small fw-bold">ชื่อหน่วยงานใหม่</label>
                        <input type="text" id="input-org-name" class="form-control" placeholder="เช่น กองร้อยบริการ" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-save me-1"></i> บันทึก</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- รายการหน่วยงานทั้งหมด -->
        <div class="card border-0 shadow-sm p-4">
            <h6 class="fw-bold mb-3">รายการหน่วยงานในระบบ</h6>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ลำดับ</th>
                            <th>สังกัด</th>
                            <th>ชื่อหน่วยงาน</th>
                            <th class="text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="org-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadDepartments();
            loadOrganizations();
        };

        async function loadDepartments() {
            const res = await fetch('/api/departments');
            const depts = await res.json();
            let opt = '<option value="">-- เลือกสังกัด --</option>';
            depts.forEach(d => opt += `<option value="${d.id}">${d.name}</option>`);
            document.getElementById('select-dept').innerHTML = opt;
        }

        async function loadOrganizations() {
            const res = await fetch('/api/organizations');
            const orgs = await res.json();
            const tbody = document.getElementById('org-table-body');
            tbody.innerHTML = '';

            if(!orgs.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">ยังไม่มีข้อมูลหน่วยงาน</td></tr>';
                return;
            }

            orgs.forEach((item, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><span class="badge bg-primary-subtle text-primary border">${item.department_name}</span></td>
                        <td class="fw-bold">${item.name}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteOrg(${item.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function saveOrganization(e) {
            e.preventDefault();
            const department_id = document.getElementById('select-dept').value;
            const name = document.getElementById('input-org-name').value.trim();

            const res = await fetch('/api/organizations', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, department_id })
            });

            if(res.ok) {
                document.getElementById('input-org-name').value = '';
                loadOrganizations();
            } else {
                alert('เกิดข้อผิดพลาดในการบันทึก');
            }
        }

        async function deleteOrg(id) {
            if(!confirm('ยืนยันการลบหน่วยงานนี้?')) return;
            const res = await fetch(`/api/organizations/${id}`, { method: 'DELETE' });
            if(res.ok) loadOrganizations();
        }
    </script>
</body>
</html>
